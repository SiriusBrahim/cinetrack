name: Cinethos CI

on:
  push:
    branches: [main, master]
  # Faz 3: yığılmış (stacked) PR'lar da doğrulansın; hedef dal filtresi yok.
  pull_request:

jobs:
  verify:
    name: Lint, Test, Build & Production Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Verify Node.js version contract
        run: node -e "const want=require('fs').readFileSync('.nvmrc','utf8').trim();const got=process.versions.node;if(got!==want){console.error('Node sürümü .nvmrc ile uyuşmuyor:',got,'!=',want);process.exit(1)}"

      - name: Clean install dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Snapshot real data dir (test isolation gate)
        run: node scripts/check-data-integrity.mjs snapshot /tmp/cinetrack-data-manifest-before.json ./data

      - name: Lint & Typecheck
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Taste Engine Tests
        run: npm run test:taste

      - name: Verify real data dir unchanged (test isolation gate)
        run: node scripts/check-data-integrity.mjs verify /tmp/cinetrack-data-manifest-before.json ./data

      - name: Production Build
        run: npm run build

      - name: Prune devDependencies for production verification
        run: npm prune --omit=dev

      - name: Production Server Startup Smoke Test (--omit=dev)
        run: |
          NODE_ENV=production CINETRACK_HOST=127.0.0.1 PORT=3199 npm start > /tmp/cinetrack-prod.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3199/api/tmdb-status > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:3199/api/tmdb-status | grep -q '"source"'
          curl -fsS http://127.0.0.1:3199/ | grep -q '<div id="root"></div>'
          curl -fsS http://127.0.0.1:3199/discover/deep-link | grep -q '<div id="root"></div>'
          echo "Production smoke test (--omit=dev) passed."

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Clean install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
